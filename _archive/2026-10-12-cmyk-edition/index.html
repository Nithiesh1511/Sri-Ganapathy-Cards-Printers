    <meta name="theme-color" content="#FFF6EE" />
    <!-- Apply the saved theme before first paint, so there is no flash of the wrong one. -->
    <script>
      try {
        var t = localStorage.getItem('sgc-theme');
        if (['ivory', 'noir', 'royal', 'rosewood'].indexOf(t) < 0) t = 'ivory';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'ivory' ? 'light' : 'dark';
      } catch (e) {}
      /* First visit of a session (and motion allowed): the page opens with the hero's
         registration sequence. Hero removes this; the timeout is only a safety net. */
      try {
        if (!sessionStorage.getItem('sgc-intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.setAttribute('data-intro', 'on');
          setTimeout(function () { document.documentElement.removeAttribute('data-intro'); }, 14000);
        }
      } catch (e) {}
    </script>
